        type: array
        items: {type: string, format: uuid}
    - name: matchType
      in: path
      required: true
      description: Application (with features) or Service Account as desired
      schema: {$ref: '#/components/schemas/MatchTypeEnum'}
    get:
      tags: [FeatureFilterService]
      security:
      - bearerAuth: []
      operationId: getMatchingFilters
      responses:
        200:
          description: Service Account Details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchingFilterResults'}
        400: {description: Bad Request}
        401: {description: no permission}
  /mr-api/portfolio/{id}/feature-filter/{filterId}:
    parameters:
    - name: id
      description: the portfolio this feature filter belongs to
      in: path
      required: true
      schema: {type: string, format: uuid}
    - name: filterId
      description: the feature filter id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      tags: [FeatureFilterService]
      security:
      - bearerAuth: []
      operationId: getFeatureFilter
      responses:
        200:
          description: The feature filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureFilter'}
        400: {description: Bad Request}
        401: {description: no permission}
        404: {description: No such filter or portfolio}
        409: {description: Optimistic locking failure}
    delete:
      parameters:
      - name: version
        description: The version of the feature you are trying to delete, must be
          passed, must be current
        in: query
        required: true
        schema: {type: integer}
      tags: [FeatureFilterService]
      security:
      - bearerAuth: []
      operationId: deleteFeatureFilter
      description: Delete the filter, it must have the same ID and version as the
        existing one to be successfully deleted.
      responses:
        200:
          description: Deleted feature filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureFilter'}
        400: {description: Bad Request}
        401: {description: no permission}
        404: {description: No such filter or portfolio}
        409: {description: Optimistic locking failure}
  /mr-api/portfolio/{id}/feature-filter:
    parameters:
    - name: id
      description: the portfolio this feature filter belongs to
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      tags: [FeatureFilterService]
      security:
      - bearerAuth: []
      operationId: createFeatureFilter
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFeatureFilter'}
      responses:
        201:
          description: Created feature filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureFilter'}
        400: {description: Bad Request}
        401: {description: no permission}
        404: {description: No such filter or portfolio}
    put:
      tags: [FeatureFilterService]
      security:
      - bearerAuth: []
      operationId: updateFeatureFilter
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeatureFilter'}
      responses:
        200:
          description: Updated feature filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureFilter'}
        400: {description: Bad Request}
        401: {description: no permission}
        404: {description: No such filter or portfolio}
        409: {description: Optimistic locking failure}
    get:
      description: Gets all of the feature filters listed in this portfolio with appropriate
        filtering
      tags: [FeatureFilterService]
      security:
      - bearerAuth: []
      parameters:
      - name: filter
        description: include environments for each account
        in: query
        schema: {type: string}
        required: false
      - name: max
        description: The maximum number of features to get for this page
        in: query
        schema: {type: integer}
        required: false
      - name: page
        description: The page number of the results. 0 indexed.
        in: query
        schema: {type: integer}
        required: false
      - name: sortOrder
        in: query
        schema: {$ref: '#/components/schemas/SortOrder'}
        required: false
      - name: includeDetails
        in: query
        required: false
        description: Should we include all of the details of the search result or
          just the id and name
        schema: {type: boolean}
      operationId: findFeatureFilters
      responses:
        200:
          description: List of feature filters found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchFeatureFilterResult'}
        400: {description: Bad Request}
        401: {description: no permission}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    EnvironmentFeaturesResult:
      type: object
      properties:
        featureValues:
          type: array
          items: {$ref: '#/components/schemas/FeatureValue'}
        environments:
          type: array
          items: {$ref: '#/components/schemas/Environment'}
        applications:
          type: array
          items: {$ref: '#/components/schemas/Application'}
        features:
          type: array
          items: {$ref: '#/components/schemas/Feature'}
    SearchPersonResult:
      type: object
      required: [max]
      properties:
        max: {type: integer}
        people:
          type: array
          description: This is for backwards compatibility
          items: {$ref: '#/components/schemas/Person'}
        summarisedPeople:
          type: array
          description: If we return the new result type, we are returning a summarised
            person for less data
          items: {$ref: '#/components/schemas/SearchPerson'}
        outstandingRegistrations:
          type: array
          items: {$ref: '#/components/schemas/OutstandingRegistration'}
    OutstandingRegistration:
      type: object
      required: [id, token, expired]
      properties:
        id: {type: string, format: uuid}
        token: {type: string}
        expired: {type: boolean}
    SetupSiteAdmin:
      required: [organizationName, portfolio]
      properties:
        portfolio: {type: string}
        organizationName: {type: string}
        emailAddress: {nullable: true, description: User's email or blank if using
            oauth/saml, format: email, type: string}
        password: {nullable: true, description: User's password or blank if using
            oauth/saml, type: string}
        name: {nullable: true, description: user's name. Will be take from external
            provider if using oauth/saml, type: string}
        authProvider: {nullable: true, description: 'If the site is using external
            providers, this is the key of the provider chosen. If there is only one,
            it can be blank.', type: string}
      type: object
    SetupResponse:
      type: object
      required: [organization, providers, providerInfo, capabilityInfo]
      properties:
        organization: {$ref: '#/components/schemas/Organization'}
        providers:
          type: array
          items: {type: string}
        providerInfo:
          type: object
          additionalProperties: {$ref: '#/components/schemas/IdentityProviderInfo'}
        capabilityInfo:
          additionalProperties: {type: string}
        redirectUrl: {description: Set if there is only one external provider and
            no local. Allows immediate redirect to provider. It assumes it will be
            used immediate (e.g. state in oauth2 url), type: string, nullable: true}
    IdentityProviderInfo:
      type: object
      required: [buttonBackgroundColor, buttonIcon, buttonText]
      properties:
        buttonIcon: {type: string}
        buttonBackgroundColor: {type: string}
        buttonText: {type: string}
    SetupMissingResponse:
      type: object
      properties:
        providers:
          type: array
          items: {type: string}
        capabilityInfo:
          additionalProperties: {type: string}
        providerInfo:
          type: object
          additionalProperties: {$ref: '#/components/schemas/IdentityProviderInfo'}
    ProviderRedirect:
      type: object
      properties:
        redirectUrl: {type: string}
    TokenizedPerson:
      type: object
      properties:
        accessToken: {type: string, nullable: true}
        refreshToken: {type: string, nullable: true}
        redirectUrl: {type: string, nullable: true}
        capabilityInfo:
          nullable: true
          additionalProperties: {type: string}
        person:
          nullable: true
          allOf:
          - {$ref: '#/components/schemas/Person'}
    RegistrationUrl:
      type: object
      required: [token, personId]
      properties:
        registrationUrl: {nullable: true, type: string}
        personId: {type: string, format: uuid}
        token: {type: string}
    PersonRegistrationDetails:
      type: object
      required: [name, email, password, confirmPassword, registrationToken]
      properties:
        name: {type: string, maxLength: 100, minLength: 1}
        email: {type: string, maxLength: 100, minLength: 1, format: email}
        password: {type: string, maxLength: 40, minLength: 1, format: password}
        confirmPassword: {type: string, maxLength: 40, minLength: 1, format: password}
        registrationToken: {type: string}
    AdminServiceResetTokenResponse:
      type: object
      required: [token]
      properties:
        token: {type: string}
    CreatePersonDetails:
      type: object
      required: [personType]
      properties:
        email: {nullable: true, description: Can be null if a service account, type: string,
          minLength: 1, maxLength: 100, format: email}
        personType: {$ref: '#/components/schemas/PersonType'}
        name: {nullable: true, description: Can be null if a service account, type: string,
          minLength: 1, maxLength: 100}
        groupIds:
          nullable: true
          default: []
          type: array
          items: {type: string, format: uuid}
    UserCredentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, maxLength: 100, format: email}
        password: {type: string, maxLength: 100}
    PasswordReset:
      type: object
      required: [password]
      properties:
        password: {type: string}
        reactivate: {default: false, type: boolean}
    PasswordUpdate:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: {maxLength: 100, format: password, type: string}
        newPassword: {maxLength: 100, format: password, type: string}
    RolloutStrategyValidationRequest:
      type: object
      description: A collection of strategies to validate together to see if it violates
        any rules
      properties:
        customStrategies:
          type: array
          items: {$ref: '#/components/schemas/RolloutStrategy'}
        sharedStrategies:
          type: array
          items: {$ref: '#/components/schemas/RolloutStrategyInstance'}
    CustomRolloutStrategyViolation:
      type: object
      properties:
        strategy: {$ref: '#/components/schemas/RolloutStrategy'}
        violations:
          type: array
          items: {$ref: '#/components/schemas/RolloutStrategyViolation'}
    SharedRolloutStrategyViolation:
      type: object
      properties:
        strategy: {$ref: '#/components/schemas/RolloutStrategyInstance'}
        violation:
          type: array
          items: {$ref: '#/components/schemas/RolloutStrategyViolation'}
    RolloutStrategyValidationResponse:
      type: object
      properties:
        customStategyViolations:
          type: array
          items: {$ref: '#/components/schemas/CustomRolloutStrategyViolation'}
        sharedStrategyViolations:
          type: array
          items: {$ref: '#/components/schemas/SharedRolloutStrategyViolation'}
        violations:
          type: array
          items: {$ref: '#/components/schemas/RolloutStrategyCollectionViolationType'}
    RolloutStrategyViolation:
      type: object
      required: [violation]
      properties:
        id: {nullable: true, description: The id of the attribute (if any). if none
            is provided it is a problem with the strategy itself, type: string}
        violation: {$ref: '#/components/schemas/RolloutStrategyViolationType'}
    RolloutStrategyViolationType:
      type: string
      enum: [no_name, name_too_long, empty_match_criteria, negative_percentage, percentage_over_100_percent,
        array_attribute_no_values, attr_invalid_well_known_enum, attr_missing_value,
        attr_missing_conditional, attr_missing_field_name, attr_missing_field_type,
        attr_val_not_semantic_version, attr_val_not_number, attr_val_not_date, attr_val_not_date_time,
        attr_val_not_cidr, attr_unknown_failure]
    RolloutStrategyCollectionViolationType:
      type: string
      enum: [percentage_adds_over_100_percent, boolean_has_no_value]
    ResetApiKeyType:
      type: string
      enum: [client_eval_only, server_eval_only]
    FeatureEnvironment:
      type: object
      properties:
        environment: {$ref: '#/components/schemas/Environment'}
        roles:
          description: the roles of this person in this environment
          default: []
          type: array
          items: {$ref: '#/components/schemas/RoleType'}
        featureValue:
          nullable: true
          allOf:
          - {$ref: '#/components/schemas/FeatureValue'}
        serviceAccounts:
          default: []
          type: array
          items: {$ref: '#/components/schemas/ServiceAccount'}
    ApplicationFeatureValues:
      type: object
      required: [applicationId, features, environments, maxFeatures]
      properties:
        applicationId: {type: string, format: uuid}
        features:
          type: array
          items: {$ref: '#/components/schemas/Feature'}
        environments:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentFeatureValues'}
        maxFeatures: {type: integer}
    EnvironmentFeatureValues:
      type: object
      properties:
        environmentId: {type: string, format: uuid}
        environmentName: {type: string}
        priorEnvironmentId: {nullable: true, type: string, format: uuid}
        features:
          description: the values of the features depending on access
          type: array
          items: {$ref: '#/components/schemas/FeatureValue'}
        roles:
          description: the roles of this person in this environment
          type: array
          items: {$ref: '#/components/schemas/RoleType'}
    CreateFeature:
      type: object
      description: Only used when creating a new feature
      required: [key, name, valueType]
      properties:
        key: {type: string, description: Unique within this application}
        alias: {nullable: true, type: string, description: 'use this in code, as then
            people cannot guess your new features from their names'}
        link: {nullable: true, type: string}
        name: {type: string, description: description if any}
        valueType: {$ref: '#/components/schemas/FeatureValueType'}
        secret: {nullable: true, type: boolean, description: should the config remain
            invisible to users without secret permission}
        description: {nullable: true, type: string, maxLength: 300}
        metaData: {nullable: true, type: string, description: Metadata that may need
            to be stored. Intended for ADK use. No data limit on FHOS. 10k on SaaS.
            (stored as CLOB)}
        featureFilter:
          nullable: true
          type: array
          description: The ID's of Filters associated with this feature
          items: {type: string, format: uuid}
    Feature:
      type: object
      description: exists simply to hold the name of the feature as it exists across
        all environments
      required: [name]
      properties:
        id: {nullable: true, type: string, format: uuid}
        key: {type: string, description: Unique within this application}
        alias: {nullable: true, type: string, description: 'use this in code, as then
            people cannot guess your new features from their names'}
        link: {nullable: true, type: string}
        name: {type: string, description: description if any}
        valueType: {$ref: '#/components/schemas/FeatureValueType'}
        version: {description: used for optimistic locking when renaming a feature,
          type: integer, format: int64}
        whenArchived: {nullable: true, type: string, format: date-time}
        secret: {nullable: true, type: boolean, description: should the config remain
            invisible to users without secret permission}
        description: {nullable: true, type: string, maxLength: 300}
        metaData: {nullable: true, type: string, description: Metadata that may need
            to be stored. Intended for ADK use. No data limit on FHOS. 10k on SaaS.
            (stored as CLOB)}
        featureFilter:
          nullable: true
          type: array
          description: The ID's of Filters associated with this feature
          items: {type: string, format: uuid}
    FeatureValue:
      type: object
      required: [key, locked]
      properties:
        id: {nullable: true, type: string, format: uuid}
        key: {type: string}
        locked: {type: boolean}
        value: {description: 'Preferred now, please don''t use valueX fields'}
        valueString: {deprecated: true, nullable: true, description: default value
            if no strategy matches. interpreted by type in parent, type: string}
        valueNumber: {deprecated: true, nullable: true, type: number}
        valueBoolean: {deprecated: true, nullable: true, type: boolean}
        valueJson: {deprecated: true, nullable: true, type: string}
        retired: {nullable: false, default: false, type: boolean, description: 'if
            false or null, this feature will visible on edge. if true, it will not
            be passed to the client'}
        rolloutStrategyInstances:
          type: array
          nullable: true
          default: []
          items: {$ref: '#/components/schemas/RolloutStrategyInstance'}
        rolloutStrategies:
          description: These are custom rollout strategies that only apply to this
            feature value.
          type: array
          nullable: true
          default: []
          items: {$ref: '#/components/schemas/RolloutStrategy'}
        sharedRolloutStrategies:
          description: This is list is either provided empty (when publishing) or
            anemic so the MR will client will understand which shared strategies are
            attached without having to back-call. If provided then it will mirror
            rolloutStrategyInstances and only enabled ones will be passed back. The
            value from the rolloutStrategyInstance will be embedded. This field will
            _always_ be ignored when being sent back to the server, only rolloutStrategyInstances
            is used.
          type: array
          nullable: true
          default: []
          items: {$ref: '#/components/schemas/RolloutStrategy'}
        featureGroupStrategies:
          nullable: true
          description: There are strategies provided by feature groups (if any)
          type: array
          default: []
          items: {$ref: '#/components/schemas/ThinGroupRolloutStrategy'}
        environmentId: {nullable: true, type: string, format: uuid}
        version: {default: 0, description: used for optimistic locking. we set it
            to 0 for the initial version, type: integer, format: int64}
        whoUpdated:
          nullable: true
          allOf:
          - {$ref: '#/components/schemas/Person'}
        whenUpdated: {nullable: true, type: string, format: date-time}
        whatUpdated: {nullable: true, type: string}
    ThinGroupRolloutStrategy:
      type: object
      properties:
        name: {type: string}
        value: {description: 'The value for this strategy, currently always a string'}
        featureGroupId: {type: string, format: uuid, nullable: true, description: The
            id of the associated feature group}
    RolloutStrategyInstance:
      type: object
      properties:
        name: {description: 'This is copied from the shared rollout strategy on return,
            it is read only from the client perspective', type: string, nullable: true}
        strategyId: {type: string, format: uuid}
        value: {nullable: true, description: the value for this rollout strategy for
            this feature value}
        disabled: {nullable: true, default: false, type: boolean}
    Audit:
      type: object
      properties:
        createdBy:
          nullable: true
          allOf:
          - {$ref: '#/components/schemas/Person'}
        updatedBy:
          nullable: true
          allOf:
          - {$ref: '#/components/schemas/Person'}
        whenCreated: {nullable: true, type: string, format: date-time}
        whenUpdated: {nullable: true, type: string, format: date-time}
    EnvironmentSortOrder:
      type: string
      enum: [ASC, DESC, PRIORITY]
    SortOrder:
      nullable: true
      type: string
      enum: [ASC, DESC]
    CreatePortfolio:
      type: object
      required: [name, description]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {nullable: true, type: string, maxLength: 400}
    Portfolio:
      allOf:
      - {$ref: '#/components/schemas/Audit'}
      - type: object
        required: [name, id, version]
        properties:
          id: {type: string, format: uuid}
          name: {type: string, minLength: 1, maxLength: 200}
          description: {nullable: true, type: string, maxLength: 400}
          version: {type: integer, format: int64}
          organizationId: {nullable: true, type: string, format: uuid}
          groups:
            type: array
            default: []
            items: {$ref: '#/components/schemas/Group'}
          applications:
            type: array
            default: []
            items: {$ref: '#/components/schemas/Application'}
          whenArchived: {nullable: true, type: string, format: date-time}
    ApplicationSummary:
      type: object
      required: [groupsHavePermission, serviceAccountsHavePermission, featureCount,
        environmentCount]
      properties:
        groupsHavePermission: {type: boolean}
        serviceAccountsHavePermission: {type: boolean}
        featureCount: {type: integer}
        environmentCount: {type: integer}
    CreateApplication:
      type: object
      required: [name, description]
      properties:
        name: {type: string, maxLength: 100}
        description: {type: string, maxLength: 400}
    Application:
      allOf:
      - {$ref: '#/components/schemas/Audit'}
      - type: object
        required: [name, id]
        properties:
          id: {type: string, format: uuid}
          name: {type: string, maxLength: 100}
          description: {nullable: true, type: string, maxLength: 400}
          portfolioId: {nullable: true, type: string, format: uuid}
          version: {type: integer, format: int64}
          groups:
            default: []
            type: array
            items: {$ref: '#/components/schemas/Group'}
          features:
            type: array
            default: []
            items: {$ref: '#/components/schemas/Feature'}
          environments:
            type: array
            default: []
            items: {$ref: '#/components/schemas/Environment'}
          whenArchived: {nullable: true, type: string, format: date-time}
    UpdatePerson:
      type: object
      required: [version]
      properties:
        name: {nullable: true, type: string, minLength: 1, maxLength: 150}
        email: {nullable: true, type: string, format: email, maxLength: 100}
        version: {description: This keeps track of which person version we are updating
            in case the user tries to update an old record, type: integer, format: int64}
        groups:
          nullable: true
          type: array
          items: {type: string, format: uuid}
        unarchive: {nullable: true, type: boolean}
    Person:
      type: object
      properties:
        id:
          nullable: true
          allOf:
          - {$ref: '#/components/schemas/PersonId'}
        name: {type: string, minLength: 1, maxLength: 150, nullable: true}
        email: {type: string, format: email, maxLength: 100, nullable: true}
        personType:
          nullable: true
          allOf:
          - {$ref: '#/components/schemas/PersonType'}
        other: {nullable: true, type: string}
        source: {nullable: true, type: string}
        version: {nullable: true, type: integer, format: int64}
        passwordRequiresReset: {nullable: true, type: boolean}
        groups:
          nullable: false
          default: []
          type: array
          items: {$ref: '#/components/schemas/Group'}
        whenArchived: {nullable: true, type: string, format: date-time}
        whenLastAuthenticated: {nullable: true, description: This is the timestamp
            in UTC when they last logged into the system, type: string, format: date-time}
        whenLastSeen: {nullable: true, description: This is the timestamp in UTC when
            they last made a request to the system on their most recent login. If
            it is null it means they have no current token or have never logged in.,
          type: string, format: date-time}
        additional:
          nullable: true
          type: array
          default: []
          items: {$ref: '#/components/schemas/PersonInfo'}
    SearchPersonSortBy:
      type: string
      enum: [name, activationStatus]
    SearchPerson:
      type: object
      required: [groupCount, name, email, personType, id, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        version: {type: integer, format: int64}
        personType: {$ref: '#/components/schemas/PersonType'}
        whenLastAuthenticated: {nullable: true, description: This is the timestamp
            in UTC when they last logged into the system, type: string, format: date-time}
        whenLastSeen: {description: This is the timestamp in UTC when they last made
            a request to the system on their most recent login. If it is null it means
            they have no current token or have never logged in., type: string, format: date-time,
          nullable: true}
        whenDeactivated: {nullable: true, description: When a person's account was
            deactivated (if it was) and when, type: string, format: date-time}
        groupCount: {type: integer}
    PersonInfo:
      type: object
      required: [key, value]
      properties:
        key: {description: e.g. serviceAccountId, type: string}
        value: {type: string}
    PersonType:
      type: string
      default: person
      enum: [person, serviceAccount, sdkServiceAccount]
    PersonId:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    ApplicationPermissions:
      type: object
      required: [applicationRoles, environments]
      properties:
        applicationRoles:
          type: array
          items: {$ref: '#/components/schemas/ApplicationRoleType'}
        environments:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentPermission'}
    EnvironmentPermission:
      type: object
      required: [id, name, roles]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleType'}
    CreateEnvironment:
      type: object
      required: [name, description]
      properties:
        name: {type: string, minLength: 1, maxLength: 150}
        priorEnvironmentId: {type: string, format: uuid, nullable: true}
        description: {type: string, maxLength: 400}
        environmentInfo:
          nullable: true
          additionalProperties: {type: string}
        production: {default: false, description: 'is this a production environment?',
          type: boolean}
    Environment:
      allOf:
      - {$ref: '#/components/schemas/Audit'}
      - type: object
        required: [name, id]
        properties:
          id: {type: string, format: uuid}
