          type: array
          items: {$ref: '#/components/schemas/FeatureGroupListGroup'}
    ApplicationRolloutStrategyList:
      type: object
      required: [max, page, items]
      properties:
        max: {description: how many there are, type: integer}
        page: {description: this page number, type: integer}
        items:
          description: the application rollout strategies on this page
          type: array
          items: {$ref: '#/components/schemas/ListApplicationRolloutStrategyItem'}
    CreateApplicationRolloutStrategy:
      allOf:
      - {$ref: '#/components/schemas/BaseUIStrategy'}
      - {$ref: '#/components/schemas/BaseStrategy'}
    UpdateApplicationRolloutStrategy:
      type: object
      properties:
        percentage: {nullable: true, description: value between 0 and 1000000 - for
            four decimal places, type: integer}
        percentageAttributes:
          nullable: true
          default: []
          type: array
          description: if you don't wish to apply percentage based on user id, you
            can use one or more attributes defined here
          items: {type: string}
        name: {nullable: true, description: names are unique in a case insensitive
            fashion, type: string, maxLength: 150}
        colouring: {nullable: true, description: the colour used to display the strategy
            in the UI. indexed table of background/foreground combos., type: integer}
        avatar: {nullable: true, type: string, description: url to avatar (if any).
            Not sent to SDK. Preferably a unicorn., maxLength: 200}
        disabled: {nullable: true, default: false, type: boolean}
        attributes:
          nullable: true
          type: array
          items: {$ref: '#/components/schemas/RolloutStrategyAttribute'}
        whenCreated: {type: string, format: date-time, nullable: true}
        whenUpdated: {type: string, format: date-time, nullable: true}
    ApplicationRolloutStrategy:
      allOf:
      - {$ref: '#/components/schemas/BaseStrategy'}
      - {$ref: '#/components/schemas/BaseUIStrategy'}
      - type: object
        properties:
          id: {description: unique id of the strategy, type: string, format: uuid}
    ListApplicationRolloutStrategyItemUser:
      type: object
      properties:
        email: {type: string}
        name: {type: string, description: They may not have set their name yet, nullable: true}
    ListApplicationRolloutStrategyItem:
      type: object
      properties:
        strategy: {$ref: '#/components/schemas/ApplicationRolloutStrategy'}
        whenUpdated: {type: string, format: date-time}
        whenCreated: {type: string, format: date-time}
        updatedBy: {$ref: '#/components/schemas/ListApplicationRolloutStrategyItemUser'}
        uniqueCode: {description: 'The code for this application strategy, usually
            the ID for strategies', type: string, nullable: true}
        usage:
          description: usage of the strategy
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ApplicationRolloutStrategyEnvironment'}
    ApplicationRolloutStrategyEnvironment:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        featuresCount: {type: integer}
    SystemConfigDecryptResult:
      type: object
      properties:
        result: {type: string, nullable: true}
    SystemConfigs:
      type: object
      properties:
        configs:
          type: array
          items: {$ref: '#/components/schemas/SystemConfig'}
    SystemConfig:
      type: object
      properties:
        key: {nullable: false, type: string}
        encrypted: {nullable: false, type: boolean}
        version: {nullable: false, type: integer, format: int64}
        value: {description: Some value. This value gets stored as a faux-JSON object}
    UpdatedSystemConfigs:
      type: object
      properties:
        tryOut:
          nullable: true
          type: array
          items: {type: string}
        configs:
          type: array
          items: {$ref: '#/components/schemas/UpdatedSystemConfig'}
    UpdatedSystemConfig:
      type: object
      properties:
        key: {nullable: false, type: string}
        version: {nullable: false, type: integer, format: int64}
        value: {description: Some value. This value gets stored as a faux-JSON object}
    SearchFeatureFilterResult:
      type: object
      description: The result of a search for feature filters
      required: [max]
      properties:
        pagination: {$ref: '#/components/schemas/PaginationResult'}
        filters:
          type: array
          items: {$ref: '#/components/schemas/SearchFeatureFilterItem'}
    CreateFeatureFilter:
      type: object
      description: A filter used by an API key to determine what kind of features
        it should send to the client
      required: [name]
      properties:
        name: {type: string, description: Unique within this portfolio}
        description: {nullable: true, type: string, maxLength: 300}
    FeatureFilter:
      type: object
      description: A filter used by an API key to determine what kind of features
        it should send to the client
      required: [id, name, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: Unique within this portfolio, maxLength: 60}
        description: {nullable: true, type: string, maxLength: 300}
        version: {nullable: false, type: integer}
        whoCreated: {$ref: '#/components/schemas/OptionalAnemicPerson'}
    SearchFeatureFilterServiceAccount:
      type: object
      description: Details the service accounts that use this filter
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    SearchFeatureFilterFeature:
      type: object
      description: Details the feature key and which application it is that is using
        this feature filter.
      required: [id, key]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
    SearchFeatureFilterApplication:
      type: object
      description: An application which contains features. Features can be null or
        empty if the user has no permission.
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        features:
          description: If the user has permission to this application, the features
            that match.
          nullable: true
          type: array
          items: {$ref: '#/components/schemas/SearchFeatureFilterFeature'}
    SearchFeatureFilterItem:
      allOf:
      - {$ref: '#/components/schemas/FeatureFilter'}
      - type: object
        properties:
          serviceAccounts:
            nullable: true
            type: array
            items: {$ref: '#/components/schemas/SearchFeatureFilterServiceAccount'}
          applications:
            description: The applications, if any that have features that used this
              filter.
            nullable: true
            type: array
            items: {$ref: '#/components/schemas/SearchFeatureFilterApplication'}
    MatchingFilter:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    MatchingFilterResult:
      type: object
      description: Describes the service account or application and its matching filters,
        depending on what was requested
      properties:
        name: {type: string}
        id: {type: string, format: uuid}
        description: {type: string, nullable: true}
        matchingFilters:
          type: array
          description: The filters that matched those requested. May not be all.
          items: {$ref: '#/components/schemas/MatchingFilter'}
    MatchingFilterResults:
      description: When a user requests what service accounts or applications (with
        features) are available for a list of filters, this is the primary object
        returned. It is the same return data for service accounts and applications.
      type: object
      properties:
        matchingResults:
          type: array
          items: {$ref: '#/components/schemas/MatchingFilterResult'}
    MatchTypeEnum:
      type: string
      enum: [applications, serviceaccounts]
    PaginationResult:
      type: object
      required: [total, page, pageSize]
      properties:
        total: {description: What is the total number of records, type: integer}
        page: {description: What page are we on, type: integer}
        pageSize: {description: What was the page size chosen (if not passed), type: integer}
    PaginationRequest:
      type: object
      description: 'Use in query as style: form, explode: true'
      properties:
        page: {nullable: true, type: integer}
        pageSize: {nullable: true, type: integer}
        filter: {nullable: true, type: string}
        sortOrder: {$ref: '#/components/schemas/SortOrder'}
        sortBy: {nullable: true, type: string}
